<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Aventura Matemática! Tablas del 2 al 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Fredoka', 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #bae6fd 0%, #e0f2fe 45%, #fef08a 100%);
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            overflow-x: hidden;
            position: relative;
        }
        .decoracion-fondo {
            position: fixed;
            font-size: 3.5rem;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            animation: flotar 6s ease-in-out infinite;
        }
        .dec-1 { top: 8%; left: 8%; animation-delay: 0s; }
        .dec-2 { top: 15%; right: 10%; animation-delay: 1.5s; }
        .dec-3 { bottom: 12%; left: 10%; animation-delay: 3s; }
        .dec-4 { bottom: 15%; right: 8%; animation-delay: 4.5s; }

        @keyframes flotar {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(8deg); }
        }

        .contenedor {
            background-color: #ffffff;
            padding: 1.6rem;
            border-radius: 32px;
            box-shadow: 0 12px 0 #cbd5e1, 0 20px 40px rgba(14, 116, 144, 0.18);
            text-align: center;
            width: 100%;
            max-width: 480px;
            border: 4px solid #38bdf8;
            position: relative;
            z-index: 1;
        }

        .barra-jugador {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f9ff;
            border: 2px solid #bae6fd;
            padding: 8px 12px;
            border-radius: 20px;
            margin-bottom: 1rem;
            gap: 8px;
        }

        .info-usuario {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: #0369a1;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .info-usuario:hover {
            background: #e0f2fe;
        }

        .btn-top {
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
            color: #713f12;
            border: none;
            padding: 7px 14px;
            border-radius: 14px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #ca8a04;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.1s;
        }
        .btn-top:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #ca8a04;
        }

        .header-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge-nivel {
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.12);
        }
        .nivel-facil { background: #4ade80; color: #064e3b; }
        .nivel-medio { background: #facc15; color: #713f12; }
        .nivel-alto { background: #fb7185; color: #ffffff; }

        .pills-marcador {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .pill-stat {
            background: #fef9c3;
            border: 2px solid #facc15;
            color: #854d0e;
            padding: 5px 9px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .marcador-puntos {
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #854d0e;
            margin-bottom: 0.6rem;
        }
        .pill-racha {
            background: #ffedd5;
            border: 2px solid #fb923c;
            color: #9a3412;
        }
        .pill-vidas {
            background: #ffe4e6;
            border: 2px solid #fda4af;
            color: #be123c;
            padding: 5px 8px;
            border-radius: 50px;
            font-size: 0.82rem;
            letter-spacing: 1px;
        }

        .progreso-contenedor {
            width: 100%;
            height: 14px;
            background: #e2e8f0;
            border-radius: 20px;
            margin-bottom: 1.2rem;
            padding: 3px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
        }
        .progreso-barra {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            border-radius: 20px;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
        }

        .tarjeta-operacion {
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 3px dashed #7dd3fc;
            border-radius: 24px;
            padding: 1.1rem;
            margin-bottom: 1.3rem;
        }

        .operacion {
            font-size: 4.3rem;
            font-weight: 700;
            margin: 0;
            color: #0284c7;
            letter-spacing: 2px;
            text-shadow: 2px 3px 0px #bae6fd;
        }

        .pop-anim {
            animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .grid-opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn-opcion {
            border: none;
            border-radius: 22px;
            padding: 18px 10px;
            font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s;
        }

        .btn-color-0 { background-color: #38bdf8; color: #ffffff; box-shadow: 0 7px 0 #0284c7; }
        .btn-color-1 { background-color: #a78bfa; color: #ffffff; box-shadow: 0 7px 0 #7c3aed; }
        .btn-color-2 { background-color: #fb923c; color: #ffffff; box-shadow: 0 7px 0 #ea580c; }
        .btn-color-3 { background-color: #f472b6; color: #ffffff; box-shadow: 0 7px 0 #db2777; }

        .btn-opcion:hover:not(:disabled) {
            filter: brightness(1.06);
            transform: translateY(-2px);
        }
        .btn-opcion:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }

        .vista-resultado {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0.4rem 0;
        }

        .recuadro-correcto-grande {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            color: #ffffff;
            border: 4px solid #16a34a;
            box-shadow: 0 9px 0 #15803d, 0 14px 28px rgba(34, 197, 94, 0.35);
            border-radius: 26px;
            padding: 20px 34px;
            font-size: 3.8rem;
            font-weight: 700;
            width: 85%;
            max-width: 270px;
            text-shadow: 0 3px 0 #15803d;
            animation: expandir-verde 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .recuadro-incorrecto-chico {
            background-color: #ef4444;
            color: #ffffff;
            border: 3px solid #dc2626;
            box-shadow: 0 5px 0 #991b1b;
            border-radius: 16px;
            padding: 7px 20px;
            font-size: 1.5rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: aparecer-error 0.35s ease forwards;
        }

        @keyframes expandir-verde {
            0% { transform: scale(0.65); opacity: 0.4; }
            70% { transform: scale(1.07); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes aparecer-error {
            0% { transform: translateY(-8px) scale(0.85); opacity: 0; }
            35% { transform: translateX(-6px); opacity: 1; }
            70% { transform: translateX(6px); }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        .mensaje-estado {
            margin-top: 1.3rem;
            font-size: 1.15rem;
            min-height: 32px;
            font-weight: 700;
            color: #475569;
        }

        .pantalla-inicio {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .titulo-inicio {
            font-size: 1.8rem;
            color: #0284c7;
            margin: 0;
        }
        .subtitulo-inicio {
            font-size: 1rem;
            color: #64748b;
            margin: 0;
        }
        .input-nombre {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.25rem;
            border: 3px solid #7dd3fc;
            border-radius: 18px;
            text-align: center;
            outline: none;
            color: #0f172a;
            user-select: text;
        }
        .input-nombre:focus {
            border-color: #0284c7;
        }
        .btn-jugar {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 0 #15803d;
            transition: transform 0.1s;
        }
        .btn-jugar:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #15803d;
        }

        .chips-jugadores {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
            max-height: 150px;
            overflow-y: auto;
            padding: 4px;
        }
        .chip-jugador {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            color: #334155;
            padding: 6px 14px;
            border-radius: 50px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .chip-jugador:hover {
            background: #e0f2fe;
            border-color: #38bdf8;
            color: #0369a1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-card {
            background: #ffffff;
            border-radius: 28px;
            border: 4px solid #facc15;
            box-shadow: 0 12px 0 #ca8a04, 0 25px 50px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 460px;
            padding: 1.5rem;
            text-align: center;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .modal-titulo {
            font-size: 1.5rem;
            color: #854d0e;
            margin: 0;
        }
        .btn-cerrar {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #475569;
            cursor: pointer;
        }
        .tabs-ranking {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 16px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.activo {
            background: #ffffff;
            color: #0284c7;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .lista-ranking {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .fila-ranking {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 16px;
            font-weight: 600;
        }
        .fila-ranking.top-1 { background: #fef9c3; border-color: #facc15; }
        .fila-ranking.top-2 { background: #f1f5f9; border-color: #94a3b8; }
        .fila-ranking.top-3 { background: #ffedd5; border-color: #fb923c; }
        .fila-ranking.es-actual { outline: 3px solid #38bdf8; }

        .rank-izq {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .medalla {
            font-size: 1.3rem;
            min-width: 28px;
            text-align: center;
        }
        .rank-nombre {
            font-size: 1.05rem;
            color: #1e293b;
        }
        .rank-sub {
            font-size: 0.78rem;
            color: #64748b;
        }
        .rank-valor {
            white-space: nowrap;
            font-size: 1.15rem;
            font-weight: 700;
            color: #0284c7;
            background: #e0f2fe;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .confeti {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 999;
            animation: caer-confeti 1.1s ease-out forwards;
        }
        @keyframes caer-confeti {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(720deg) scale(0.4); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="decoracion-fondo dec-1">🚀</div>
<div class="decoracion-fondo dec-2">⭐</div>
<div class="decoracion-fondo dec-3">🎮</div>
<div class="decoracion-fondo dec-4">🏆</div>

<div class="contenedor">
    <!-- PANTALLA 1: REGISTRO / SELECCIÓN DE JUGADOR -->
    <div id="pantallaInicio" class="pantalla-inicio">
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-top" onclick="abrirRanking()">🏆 Ver Top</button>
        </div>
        <h1 class="titulo-inicio">🚀 ¡Aventura Matemática!</h1>
        <p class="subtitulo-inicio">Escribe tu nombre o elige tu perfil para jugar</p>

        <input type="text" id="inputNombre" class="input-nombre" placeholder="Ej: Ignacio, Alan..." maxlength="20" autocomplete="off">
        <button class="btn-jugar" onclick="iniciarConNombre()">¡A Jugar! 🎮</button>

        <div id="contenedorJugadoresGuardados" style="display:none; margin-top: 0.5rem;">
            <p class="subtitulo-inicio" style="font-size: 0.85rem; margin-bottom: 6px;">Jugadores registrados:</p>
            <div class="chips-jugadores" id="listaChips"></div>
        </div>
    </div>

    <!-- PANTALLA 2: JUEGO ACTIVO -->
    <div id="pantallaJuego" style="display: none;">
        <div class="barra-jugador">
            <div class="info-usuario" onclick="cambiarJugador()" title="Cambiar de jugador">
                <span>👤</span>
                <span id="nombreJugadorActivo">Ignacio</span>
                <span style="font-size: 0.75rem; color: #64748b;">(Cambiar)</span>
            </div>
            <button class="btn-top" onclick="abrirRanking()">🏆 Top</button>
        </div>

        <div class="header-superior">
            <span id="badgeNivel" class="badge-nivel nivel-facil">🌱 Fácil</span>
            <div class="pills-marcador">
                <div class="pill-stat" id="contadorProgreso">⭐ 0/10</div>
                <div class="pill-stat pill-racha" id="contadorRacha" title="Racha actual sin fallar">🔥 0</div>
                <div class="pill-vidas" id="indicadorVidas" title="Oportunidades antes de bajar de nivel">❤️❤️❤️</div>
            </div>
        </div>

        <div class="progreso-contenedor">
            <div class="progreso-barra" id="barraProgreso"></div>
        </div>

        <div class="marcador-puntos" id="marcadorPuntos"></div>

        <div class="tarjeta-operacion">
            <div class="operacion" id="pregunta">2 × 9</div>
        </div>

        <div class="grid-opciones" id="opciones">
            <button class="btn-opcion btn-color-0" onclick="seleccionarOpcion(0)"></button>
            <button class="btn-opcion btn-color-1" onclick="seleccionarOpcion(1)"></button>
            <button class="btn-opcion btn-color-2" onclick="seleccionarOpcion(2)"></button>
            <button class="btn-opcion btn-color-3" onclick="seleccionarOpcion(3)"></button>
        </div>

        <div class="vista-resultado" id="vistaResultado">
            <div class="recuadro-correcto-grande" id="boxCorrecto">18</div>
            <div class="recuadro-incorrecto-chico" id="boxIncorrecto" style="display: none;">✕ 16</div>
        </div>

        <div class="mensaje-estado" id="mensaje">¡Elige el resultado correcto!</div>
    </div>
</div>

<!-- MODAL RANKING TOP -->
<div class="modal-overlay" id="modalRanking" onclick="if(event.target === this) cerrarRanking()">
    <div class="modal-card">
        <div class="modal-header">
            <h2 class="modal-titulo">🏆 Salón de la Fama</h2>
            <button class="btn-cerrar" onclick="cerrarRanking()">✕</button>
        </div>

        <div class="tabs-ranking">
            <button class="tab-btn activo" id="tabPuntos" onclick="cambiarTabRanking('puntos')">⭐ Puntos Totales</button>
            <button class="tab-btn" id="tabRacha" onclick="cambiarTabRanking('racha')">🔥 Mejor Racha</button>
        </div>

        <div class="lista-ranking" id="listaRanking"></div>
    </div>
</div>

<script>
    // =========================================================================
    // CONFIGURACIÓN DE ALMACENAMIENTO (Conectado a tu Firebase Realtime DB)
    // =========================================================================
    const FIREBASE_DB_URL = "https://aprende-a-multiplicar-512a9-default-rtdb.firebaseio.com/ranking.json"; 
    const STORAGE_KEY = "aventura_matematica_ranking_v1";

    const JUGADORES_INICIALES = [
        { nombre: "Ignacio", mejorPuntaje: 0, mejorRacha: 0, partidas: 0 },
        { nombre: "Alan", mejorPuntaje: 0, mejorRacha: 0, partidas: 0 }
    ];

    let baseJugadores = {};
    let jugadorActual = null;
    let tabRankingActual = 'puntos';

    const CONFIG_NIVELES = {
        1: {
            nombre: "🌱 Fácil",
            clase: "nivel-facil",
            colorBarra: "linear-gradient(90deg, #4ade80, #22c55e)",
            meta: 10,
            tablas: [2, 3],
            multiplicadores: [2, 3, 4, 5, 6, 7, 8, 9]
        },
        2: {
            nombre: "⚡ Medio",
            clase: "nivel-medio",
            colorBarra: "linear-gradient(90deg, #facc15, #eab308)",
            meta: 15,
            tablas: [4, 5, 6],
            multiplicadores: [2, 3, 4, 5, 6, 7, 8, 9]
        },
        3: {
            nombre: "🔥 Difícil",
            clase: "nivel-alto",
            colorBarra: "linear-gradient(90deg, #fb7185, #f43f5e)",
            meta: null,
            tablas: [7, 8, 9],
            multiplicadores: [2, 3, 4, 5, 6, 7, 8, 9]
        }
    };

    let nivelActual = 1;
    let aciertosEnNivel = 0;
    let erroresSeguidos = 0;
    let puntosPartida = 0;
    let rachaActual = 0;
    let num1 = 2;
    let num2 = 9;
    let respuestaCorrecta = 18;
    let opcionesActuales = [];
    let bloqueado = false;
    let mazoPreguntas = [];

    const elPantallaInicio = document.getElementById('pantallaInicio');
    const elPantallaJuego = document.getElementById('pantallaJuego');
    const elInputNombre = document.getElementById('inputNombre');
    const elListaChips = document.getElementById('listaChips');
    const elContenedorChips = document.getElementById('contenedorJugadoresGuardados');
    const elNombreActivo = document.getElementById('nombreJugadorActivo');

    const elBadge = document.getElementById('badgeNivel');
    const elContador = document.getElementById('contadorProgreso');
    const elMarcador = document.getElementById('marcadorPuntos');
    const elRacha = document.getElementById('contadorRacha');
    const elVidas = document.getElementById('indicadorVidas');
    const elBarra = document.getElementById('barraProgreso');
    const elPregunta = document.getElementById('pregunta');
    const elGridOpciones = document.getElementById('opciones');
    const elVistaResultado = document.getElementById('vistaResultado');
    const elBoxCorrecto = document.getElementById('boxCorrecto');
    const elBoxIncorrecto = document.getElementById('boxIncorrecto');
    const elMensaje = document.getElementById('mensaje');
    const botones = document.querySelectorAll('.btn-opcion');

    // =========================================================================
    // SEGURIDAD Y FUSIÓN DE DATOS
    // - sanitizarNombre: quita caracteres que Firebase no admite en claves
    //   (. # $ [ ] /) y los que sirven para inyectar HTML (< >).
    // - fusionarJugador: conserva siempre el MAYOR valor de cada campo, de modo
    //   que un dato desfasado (offline / otro dispositivo) nunca pisa un récord.
    // =========================================================================
    const MAX_NOMBRE = 20;

    function sanitizarNombre(texto) {
        return String(texto == null ? '' : texto)
            .replace(/[.#$\[\]\/<>\\\u0000-\u001f\u007f]/g, '')
            .replace(/\s+/g, ' ')
            .trim()
            .slice(0, MAX_NOMBRE)
            .trim();
    }

    function claveDe(nombre) {
        return nombre.toLowerCase();
    }

    function entero(v) {
        const n = Math.floor(Number(v));
        return Number.isFinite(n) && n > 0 ? n : 0;
    }

    // Devuelve un jugador limpio o null si el dato no se puede usar.
    // puntosTotales: puntos acumulados ya confirmados. Los registros anteriores a
    // este campo arrancan con su mejor puntaje.
    // pendientes: puntos ganados en este dispositivo que aún no están en la nube.
    function limpiarJugador(j) {
        if (!j || typeof j !== 'object') return null;
        const nombre = sanitizarNombre(j.nombre);
        if (!nombre) return null;
        const mejorPuntaje = entero(j.mejorPuntaje);
        return {
            nombre: nombre,
            mejorPuntaje: mejorPuntaje,
            mejorRacha: entero(j.mejorRacha),
            partidas: entero(j.partidas),
            puntosTotales: j.puntosTotales === undefined ? mejorPuntaje : entero(j.puntosTotales),
            pendientes: entero(j.pendientes)
        };
    }

    // Igual que limpiarJugador, para datos de la nube (allí no existen "pendientes").
    function datoDeNube(j) {
        const limpio = limpiarJugador(j);
        if (limpio) limpio.pendientes = 0;
        return limpio;
    }

    function totalDe(j) {
        return j.puntosTotales + j.pendientes;
    }

    function fusionarJugador(a, b) {
        const x = limpiarJugador(a);
        const y = limpiarJugador(b);
        if (!x) return y;
        if (!y) return x;
        return {
            nombre: x.nombre,
            mejorPuntaje: Math.max(x.mejorPuntaje, y.mejorPuntaje),
            mejorRacha: Math.max(x.mejorRacha, y.mejorRacha),
            partidas: Math.max(x.partidas, y.partidas),
            puntosTotales: Math.max(x.puntosTotales, y.puntosTotales),
            pendientes: Math.max(x.pendientes, y.pendientes)
        };
    }

    // Mete un jugador en baseJugadores fusionando con el existente.
    // Modifica el objeto existente en sitio para no perder la referencia de jugadorActual.
    function incorporar(j) {
        const limpio = limpiarJugador(j);
        if (!limpio) return;
        const clave = claveDe(limpio.nombre);
        const actual = baseJugadores[clave];
        if (actual) {
            Object.assign(actual, fusionarJugador(actual, limpio));
        } else {
            baseJugadores[clave] = limpio;
        }
    }

    function leerLocal() {
        try {
            const guardado = localStorage.getItem(STORAGE_KEY);
            return guardado ? JSON.parse(guardado) : null;
        } catch (e) {
            return null;
        }
    }

    function guardarLocal() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(baseJugadores));
        } catch (e) {
            console.warn("No se pudo guardar en el dispositivo:", e);
        }
    }

    async function cargarBaseJugadores() {
        const local = leerLocal();
        if (local && typeof local === 'object') {
            Object.values(local).forEach(incorporar);
        } else {
            JUGADORES_INICIALES.forEach(incorporar);
        }
        guardarLocal();

        if (FIREBASE_DB_URL) {
            try {
                const res = await fetch(FIREBASE_DB_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const dataNube = await res.json();
                if (dataNube && typeof dataNube === 'object') {
                    Object.values(dataNube).forEach(j => incorporar(datoDeNube(j)));
                    guardarLocal();
                    // Sube los puntos que quedaron sin enviar (p. ej. jugados sin conexión).
                    Object.values(baseJugadores)
                        .filter(j => j.pendientes > 0)
                        .forEach(sincronizarJugador);
                }
            } catch (e) {
                console.warn("Modo offline activo:", e);
            }
        }
        renderizarChipsJugadores();
    }

    function urlJugador(clave) {
        return FIREBASE_DB_URL.replace('.json', `/${encodeURIComponent(clave)}.json`);
    }

    // Lee el registro de la nube, lo fusiona con el local (máximo de cada campo)
    // y solo entonces lo escribe. Si no se puede leer, NO escribe (así un dato
    // desfasado jamás sobrescribe un récord).
    async function subirJugador(clave) {
        if (!FIREBASE_DB_URL || !baseJugadores[clave]) return;
        const url = urlJugador(clave);

        const resLeer = await fetch(url);
        if (!resLeer.ok) throw new Error('lectura HTTP ' + resLeer.status);
        const enNube = datoDeNube(await resLeer.json());
        if (enNube && claveDe(enNube.nombre) === clave) {
            incorporar(enNube);
            // Si la nube ya tiene un nombre para este jugador, se respeta (evita que
            // "ALAN" reescriba "Alan" para todos).
            baseJugadores[clave].nombre = enNube.nombre;
        }
        guardarLocal();

        const jugador = baseJugadores[clave];
        const enviados = jugador.pendientes;
        const total = jugador.puntosTotales + enviados;

        const resEscribir = await fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nombre: jugador.nombre,
                mejorPuntaje: jugador.mejorPuntaje,
                mejorRacha: jugador.mejorRacha,
                partidas: jugador.partidas,
                puntosTotales: total
            })
        });
        if (!resEscribir.ok) throw new Error('escritura HTTP ' + resEscribir.status);

        // Solo al confirmar se descuentan los puntos enviados; los ganados mientras
        // tanto siguen pendientes para la siguiente sincronización.
        jugador.puntosTotales = Math.max(jugador.puntosTotales, total);
        jugador.pendientes -= enviados;
        guardarLocal();
        actualizarMarcador();
    }

    // Las sincronizaciones se encolan para que dos respuestas seguidas no se pisen.
    let colaSync = Promise.resolve();
    const enCola = new Set();

    function sincronizarJugador(datosJugador) {
        incorporar(datosJugador);
        const limpio = limpiarJugador(datosJugador);
        if (!limpio) return colaSync;
        const clave = claveDe(limpio.nombre);
        guardarLocal();

        // Si ya hay un envío de este jugador esperando turno, ese incluirá lo nuevo.
        if (!enCola.has(clave)) {
            enCola.add(clave);
            colaSync = colaSync
                .then(() => { enCola.delete(clave); return subirJugador(clave); })
                .catch(e => console.warn("No se pudo sincronizar con la nube:", e));
        }
        return colaSync;
    }


    function renderizarChipsJugadores() {
        const lista = Object.values(baseJugadores);
        if (lista.length === 0) {
            elContenedorChips.style.display = 'none';
            return;
        }
        elContenedorChips.style.display = 'block';
        elListaChips.innerHTML = '';

        lista.sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(jug => {
            const chip = document.createElement('button');
            chip.className = 'chip-jugador';
            chip.textContent = `👤 ${jug.nombre}`;
            chip.onclick = () => seleccionarPerfil(jug.nombre);
            elListaChips.appendChild(chip);
        });
    }

    function iniciarConNombre() {
        const nombreLimpio = sanitizarNombre(elInputNombre.value);
        if (!nombreLimpio) {
            elInputNombre.focus();
            elInputNombre.style.borderColor = '#ef4444';
            return;
        }
        elInputNombre.style.borderColor = '#7dd3fc';
        elInputNombre.value = nombreLimpio;
        seleccionarPerfil(nombreLimpio);
    }

    elInputNombre.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') iniciarConNombre();
    });

    function seleccionarPerfil(nombre) {
        nombre = sanitizarNombre(nombre);
        if (!nombre) return;
        const clave = claveDe(nombre);
        if (!baseJugadores[clave]) {
            baseJugadores[clave] = {
                nombre: nombre,
                mejorPuntaje: 0,
                mejorRacha: 0,
                partidas: 0,
                puntosTotales: 0,
                pendientes: 0
            };
        }
        jugadorActual = baseJugadores[clave];
        jugadorActual.partidas = (jugadorActual.partidas || 0) + 1;
        sincronizarJugador(jugadorActual);

        nivelActual = 1;
        aciertosEnNivel = 0;
        erroresSeguidos = 0;
        puntosPartida = 0;
        rachaActual = 0;

        elNombreActivo.textContent = jugadorActual.nombre;
        elPantallaInicio.style.display = 'none';
        elPantallaJuego.style.display = 'block';

        mazoPreguntas = construirMazoNivel(nivelActual);
        actualizarInterfazNivel();
        nuevaPregunta();
    }

    function cambiarJugador() {
        elPantallaJuego.style.display = 'none';
        elPantallaInicio.style.display = 'flex';
        elInputNombre.value = '';
        renderizarChipsJugadores();
    }

    function registrarProgresoEnRanking() {
        if (!jugadorActual) return;

        if (puntosPartida > jugadorActual.mejorPuntaje) {
            jugadorActual.mejorPuntaje = puntosPartida;
        }
        if (rachaActual > jugadorActual.mejorRacha) {
            jugadorActual.mejorRacha = rachaActual;
        }
        // Cada acierto suma puntos al total, así que siempre hay algo que guardar.
        sincronizarJugador(jugadorActual);
    }

    function actualizarMarcador() {
        if (!jugadorActual) return;
        elMarcador.textContent = `🏆 Total: ${totalDe(jugadorActual)} pts · Esta partida: ${puntosPartida}`;
    }

    async function abrirRanking() {
        await cargarBaseJugadores();
        document.getElementById('modalRanking').style.display = 'flex';
        renderizarTablaRanking();
    }

    function cerrarRanking() {
        document.getElementById('modalRanking').style.display = 'none';
    }

    function cambiarTabRanking(tab) {
        tabRankingActual = tab;
        document.getElementById('tabPuntos').classList.toggle('activo', tab === 'puntos');
        document.getElementById('tabRacha').classList.toggle('activo', tab === 'racha');
        renderizarTablaRanking();
    }

    function renderizarTablaRanking() {
        const contenedor = document.getElementById('listaRanking');
        const lista = Object.values(baseJugadores);

        if (tabRankingActual === 'puntos') {
            lista.sort((a, b) => totalDe(b) - totalDe(a) || b.mejorRacha - a.mejorRacha);
        } else {
            lista.sort((a, b) => b.mejorRacha - a.mejorRacha || totalDe(b) - totalDe(a));
        }

        contenedor.textContent = '';

        lista.forEach((jug, index) => {
            const fila = document.createElement('div');
            const esActual = jugadorActual && jug.nombre.toLowerCase() === jugadorActual.nombre.toLowerCase();
            let claseTop = '';
            let iconoPos = `#${index + 1}`;

            if (index === 0) { claseTop = 'top-1'; iconoPos = '🥇'; }
            else if (index === 1) { claseTop = 'top-2'; iconoPos = '🥈'; }
            else if (index === 2) { claseTop = 'top-3'; iconoPos = '🥉'; }

            fila.className = `fila-ranking ${claseTop} ${esActual ? 'es-actual' : ''}`;

            const valorPrincipal = tabRankingActual === 'puntos'
                ? `⭐ ${totalDe(jug)} pts`
                : `🔥 ${jug.mejorRacha} seguidos`;

            const subDetalle = tabRankingActual === 'puntos'
                ? `Mejor: ${jug.mejorPuntaje} · 🔥 ${jug.mejorRacha}`
                : `Puntos totales: ⭐ ${totalDe(jug)}`;

            // Se construye con textContent (nunca innerHTML) para que un nombre
            // malicioso guardado en la nube no pueda ejecutar código.
            const izq = document.createElement('div');
            izq.className = 'rank-izq';

            const medalla = document.createElement('span');
            medalla.className = 'medalla';
            medalla.textContent = iconoPos;

            const info = document.createElement('div');
            const nombre = document.createElement('div');
            nombre.className = 'rank-nombre';
            nombre.textContent = esActual ? `${jug.nombre} (Tú)` : jug.nombre;
            const sub = document.createElement('div');
            sub.className = 'rank-sub';
            sub.textContent = subDetalle;
            info.appendChild(nombre);
            info.appendChild(sub);

            izq.appendChild(medalla);
            izq.appendChild(info);

            const valor = document.createElement('div');
            valor.className = 'rank-valor';
            valor.textContent = valorPrincipal;

            fila.appendChild(izq);
            fila.appendChild(valor);
            contenedor.appendChild(fila);
        });
    }


    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sonido(tipo) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (tipo === 'ok') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.07);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.14);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } else if (tipo === 'nivel') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.55);
        } else if (tipo === 'bajar') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(240, audioCtx.currentTime + 0.15);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }
    }

    function lanzarConfeti(elementoOrigen, cantidad = 22) {
        const rect = elementoOrigen.getBoundingClientRect();
        const centroX = rect.left + rect.width / 2;
        const centroY = rect.top + rect.height / 2;
        const colores = ['#38bdf8', '#4ade80', '#facc15', '#fb923c', '#f472b6', '#a78bfa'];

        for (let i = 0; i < cantidad; i++) {
            const part = document.createElement('div');
            part.className = 'confeti';
            part.style.left = centroX + 'px';
            part.style.top = centroY + 'px';
            part.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];

            const angulo = Math.random() * Math.PI * 2;
            const velocidad = 60 + Math.random() * 140;
            const dx = Math.cos(angulo) * velocidad + 'px';
            const dy = (Math.sin(angulo) * velocidad - 40) + 'px';

            part.style.setProperty('--dx', dx);
            part.style.setProperty('--dy', dy);

            document.body.appendChild(part);
            setTimeout(() => part.remove(), 1100);
        }
    }

    function construirMazoNivel(nivel) {
        const cfg = CONFIG_NIVELES[nivel];
        const combinaciones = [];

        for (let t of cfg.tablas) {
            for (let m of cfg.multiplicadores) {
                if (Math.random() > 0.5) {
                    combinaciones.push({ n1: t, n2: m });
                } else {
                    combinaciones.push({ n1: m, n2: t });
                }
            }
        }

        for (let i = combinaciones.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [combinaciones[i], combinaciones[j]] = [combinaciones[j], combinaciones[i]];
        }

        if (combinaciones.length > 1 && combinaciones[0].n1 === num1 && combinaciones[0].n2 === num2) {
            [combinaciones[0], combinaciones[combinaciones.length - 1]] = [combinaciones[combinaciones.length - 1], combinaciones[0]];
        }

        return combinaciones;
    }

    function actualizarInterfazNivel() {
        const cfg = CONFIG_NIVELES[nivelActual];
        elBadge.textContent = cfg.nombre;
        elBadge.className = `badge-nivel ${cfg.clase}`;
        elBarra.style.background = cfg.colorBarra;
        elRacha.textContent = `🔥 ${rachaActual}`;

        const vidasRestantes = Math.max(0, 3 - erroresSeguidos);
        elVidas.textContent = '❤️'.repeat(vidasRestantes) + '🖤'.repeat(3 - vidasRestantes);

        if (cfg.meta) {
            elContador.textContent = `⭐ ${aciertosEnNivel}/${cfg.meta}`;
            const porcentaje = (aciertosEnNivel / cfg.meta) * 100;
            elBarra.style.width = `${porcentaje}%`;
        } else {
            elContador.textContent = `⭐ ∞`;
            elBarra.style.width = `100%`;
        }
        actualizarMarcador();
    }

    function generarDistractores(n1, n2, correcta) {
        const setOpciones = new Set([correcta]);

        const posiblesErrores = [
            n1 * (n2 + 1),
            n1 * (n2 - 1),
            (n1 + 1) * n2,
            (n1 - 1) * n2,
            correcta + 2,
            correcta - 2,
            correcta + 10
        ];

        posiblesErrores.sort(() => Math.random() - 0.5);

        for (let val of posiblesErrores) {
            if (val > 0 && val !== correcta && setOpciones.size < 4) {
                setOpciones.add(val);
            }
        }

        while (setOpciones.size < 4) {
            const aleatorio = Math.floor(Math.random() * 75) + 4;
            if (aleatorio !== correcta) setOpciones.add(aleatorio);
        }

        return Array.from(setOpciones).sort(() => Math.random() - 0.5);
    }

    function mostrarVistaResultado(esCorrecto, valorElegido) {
        elGridOpciones.style.display = 'none';
        elVistaResultado.style.display = 'flex';

        elBoxCorrecto.style.animation = 'none';
        void elBoxCorrecto.offsetWidth;
        elBoxCorrecto.style.animation = '';
        elBoxCorrecto.textContent = respuestaCorrecta;

        if (esCorrecto) {
            elBoxIncorrecto.style.display = 'none';
        } else {
            elBoxIncorrecto.style.animation = 'none';
            void elBoxIncorrecto.offsetWidth;
            elBoxIncorrecto.style.animation = '';
            elBoxIncorrecto.textContent = `✕ ${valorElegido}`;
            elBoxIncorrecto.style.display = 'inline-flex';
        }
    }

    function nuevaPregunta() {
        bloqueado = false;
        elVistaResultado.style.display = 'none';
        elGridOpciones.style.display = 'grid';

        if (mazoPreguntas.length === 0) {
            mazoPreguntas = construirMazoNivel(nivelActual);
        }

        const siguiente = mazoPreguntas.shift();
        num1 = siguiente.n1;
        num2 = siguiente.n2;
        respuestaCorrecta = num1 * num2;

        elPregunta.classList.remove('pop-anim');
        void elPregunta.offsetWidth;
        elPregunta.textContent = `${num1} × ${num2}`;
        elPregunta.classList.add('pop-anim');

        opcionesActuales = generarDistractores(num1, num2, respuestaCorrecta);

        botones.forEach((btn, idx) => {
            btn.textContent = opcionesActuales[idx];
            btn.className = `btn-opcion btn-color-${idx}`;
            btn.disabled = false;
        });

        elMensaje.textContent = "¡Elige el resultado correcto!";
        elMensaje.style.color = "#475569";
    }

    function seleccionarOpcion(indice) {
        if (bloqueado) return;
        bloqueado = true;

        const valorElegido = opcionesActuales[indice];
        botones.forEach(b => b.disabled = true);

        if (valorElegido === respuestaCorrecta) {
            aciertosEnNivel++;
            rachaActual++;
            erroresSeguidos = 0;

            const puntosBase = nivelActual === 1 ? 10 : (nivelActual === 2 ? 15 : 20);
            const ganados = puntosBase + Math.min(rachaActual, 10);
            puntosPartida += ganados;
            jugadorActual.pendientes += ganados;

            registrarProgresoEnRanking();
            mostrarVistaResultado(true, valorElegido);

            const cfg = CONFIG_NIVELES[nivelActual];

            if (cfg.meta && aciertosEnNivel >= cfg.meta) {
                sonido('nivel');
                lanzarConfeti(elBoxCorrecto, 45);
                nivelActual++;
                aciertosEnNivel = 0;
                mazoPreguntas = construirMazoNivel(nivelActual);
                elMensaje.textContent = `🎉 ¡Subiste a nivel ${CONFIG_NIVELES[nivelActual].nombre}!`;
                elMensaje.style.color = "#0284c7";
                actualizarInterfazNivel();
                setTimeout(nuevaPregunta, 1500);
            } else {
                sonido('ok');
                lanzarConfeti(elBoxCorrecto, 22);
                const frases = ["¡Genial! 🌟", "¡Súper rápido! 🚀", "¡Excelente! 🎉", "¡Eso es! ⚡"];
                elMensaje.textContent = frases[Math.floor(Math.random() * frases.length)];
                elMensaje.style.color = "#16a34a";
                actualizarInterfazNivel();
                setTimeout(nuevaPregunta, 1050);
            }
        } else {
            rachaActual = 0;
            erroresSeguidos++;
            mostrarVistaResultado(false, valorElegido);

            if (erroresSeguidos >= 3) {
                erroresSeguidos = 0;

                if (nivelActual > 1) {
                    sonido('bajar');
                    nivelActual--;
                    aciertosEnNivel = 0;
                    mazoPreguntas = construirMazoNivel(nivelActual);
                    actualizarInterfazNivel();
                    elMensaje.textContent = `⬇️ ¡3 errores seguidos! Regresas a ${CONFIG_NIVELES[nivelActual].nombre}`;
                    elMensaje.style.color = "#dc2626";
                    setTimeout(nuevaPregunta, 2400);
                } else {
                    sonido('bajar');
                    aciertosEnNivel = 0;
                    mazoPreguntas = construirMazoNivel(1);
                    actualizarInterfazNivel();
                    elMensaje.textContent = `🔄 ¡3 errores seguidos! Reinicias el nivel 🌱 Fácil (0/10)`;
                    elMensaje.style.color = "#dc2626";
                    setTimeout(nuevaPregunta, 2400);
                }
            } else {
                sonido('error');
                actualizarInterfazNivel();

                const posRefuerzo = Math.min(2, mazoPreguntas.length);
                mazoPreguntas.splice(posRefuerzo, 0, { n1: num1, n2: num2 });

                const restantes = 3 - erroresSeguidos;
                elMensaje.textContent = `¡Fíjate! ${num1} × ${num2} = ${respuestaCorrecta} (Te ${restantes === 1 ? 'queda 1 vida' : 'quedan 2 vidas'})`;
                elMensaje.style.color = "#dc2626";
                setTimeout(nuevaPregunta, 2000);
            }
        }
    }

    cargarBaseJugadores();
